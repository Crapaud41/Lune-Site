<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131d">
  <meta name="description" content="Les photographies de la Lune et de la nature, au fil des nuits.">
  <title>Photos — Au fil des nuits</title>
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      color-scheme: dark;
      --ink: #f6f1e8;
      --muted: #c5c0b7;
      --gold: #e8c17a;
      --line: rgba(255, 255, 255, .2);
      --panel: rgba(13, 17, 29, .78);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: var(--ink);
      background: #10131d url("bg-lake.jpg") center / cover no-repeat fixed;
      font-family: inherit;
    }

    body::before {
      position: fixed;
      z-index: 0;
      inset: 0;
      content: "";
      background:
        linear-gradient(90deg, rgba(8, 11, 20, .78), rgba(8, 11, 20, .35) 55%, rgba(8, 11, 20, .62)),
        linear-gradient(0deg, rgba(8, 11, 20, .55), rgba(8, 11, 20, .15));
      pointer-events: none;
    }

    a {
      color: inherit;
    }

    .photo-page {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: 100%;
      height: 100dvh;
      min-height: 0;
      padding: 22px clamp(18px, 5vw, 76px) 26px;
    }

    .photo-header {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 52px;
    }

    .photo-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(20px, 4vw, 58px);
      width: 100%;
      font-size: .76rem;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .photo-nav a {
      position: relative;
      padding: 9px 0;
      color: rgba(255, 255, 255, .85);
      text-decoration: none;
      transition: color .2s ease;
    }

    .photo-nav a:hover,
    .photo-nav a[aria-current="page"] {
      color: var(--gold);
    }

    .photo-nav a[aria-current="page"]::after {
      position: absolute;
      right: 0;
      bottom: 1px;
      left: 0;
      height: 1px;
      content: "";
      background: var(--gold);
    }

    .photo-main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      padding-top: 12px;
    }

    .intro {
      margin: 0 0 22px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--gold);
      font-size: .68rem;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 4vw, 3.4rem);
      font-weight: 400;
      line-height: 1.05;
    }

    .intro-copy {
      margin: 9px 0 0;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(.95rem, 1.5vw, 1.12rem);
      font-style: italic;
    }

    .album-choice,
    .album-gallery {
      width: min(100%, 1120px);
      margin: 0 auto;
    }

    .album-choice {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(18px, 5vw, 68px);
      align-items: center;
    }

    .album-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      padding: 0;
      border: 0;
      color: var(--ink);
      background: none;
      cursor: pointer;
      text-align: center;
    }

    .album-stack {
      position: relative;
      width: min(100%, 350px);
      height: clamp(190px, 31vh, 320px);
      margin: 0 auto 19px;
      transition: transform .25s ease;
    }

    .album-card:hover .album-stack {
      transform: translateY(-5px) rotate(-1deg);
    }

    .polaroid {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(68%, 225px);
      height: 90%;
      padding: 9px 9px 35px;
      border: 1px solid rgba(255, 255, 255, .52);
      background: #f2eee5;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .42);
      transform: translate(-50%, -50%) rotate(-8deg);
    }

    .polaroid:nth-child(2) {
      transform: translate(-50%, -50%) rotate(7deg);
    }

    .polaroid:nth-child(3) {
      transform: translate(-50%, -50%) rotate(-1deg);
    }

    .polaroid img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #10131d;
    }

    .album-emoji {
      position: absolute;
      z-index: 2;
      right: 4%;
      bottom: 0;
      display: grid;
      width: clamp(52px, 7vw, 78px);
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .38);
      border-radius: 50%;
      background: rgba(15, 19, 29, .86);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .35);
      font-size: clamp(1.7rem, 3vw, 2.4rem);
    }

    .album-name {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.35rem, 2.2vw, 1.85rem);
      font-weight: 400;
    }

    .album-hint {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: .78rem;
      letter-spacing: .08em;
    }

    .album-gallery {
      display: none;
      min-height: 0;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .album-gallery.is-visible {
      display: grid;
    }

    .gallery-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 15px;
    }

    .gallery-heading h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.45rem, 2.4vw, 2rem);
      font-weight: 400;
    }

    .back-button {
      padding: 8px 0;
      border: 0;
      color: var(--gold);
      background: none;
      cursor: pointer;
      font: inherit;
      font-size: .76rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .back-button:hover {
      color: #fff;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 12px;
      min-height: 0;
    }

    .photo-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 8px 8px 10px;
      border: 1px solid rgba(255, 255, 255, .22);
      background: var(--panel);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .28);
      cursor: zoom-in;
      text-align: left;
      transition: transform .2s ease, border-color .2s ease;
    }

    .photo-card:hover {
      z-index: 1;
      border-color: rgba(232, 193, 122, .8);
      transform: translateY(-3px);
    }

    .photo-card:nth-child(1),
    .photo-card:nth-child(2),
    .photo-card:nth-child(3) {
      grid-column: span 2;
    }

    .photo-card:nth-child(4) {
      grid-column: 2 / span 2;
    }

    .photo-card:nth-child(5) {
      grid-column: 4 / span 2;
    }

    .photo-card img {
      display: block;
      flex: 1;
      width: 100%;
      min-height: 0;
      object-fit: contain;
      background: rgba(0, 0, 0, .38);
    }

    .photo-card figcaption {
      padding: 8px 3px 0;
      color: rgba(255, 255, 255, .9);
      font-size: .76rem;
      line-height: 1.25;
    }

    .photo-card figure {
      display: contents;
      margin: 0;
    }

    .lightbox {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 48px;
      background: rgba(5, 7, 12, .94);
    }

    .lightbox.is-open {
      display: flex;
    }

    .lightbox img {
      display: block;
      max-width: min(90vw, 1200px);
      max-height: 82dvh;
      object-fit: contain;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .55);
    }

    .lightbox-caption {
      position: absolute;
      right: 70px;
      bottom: 18px;
      left: 70px;
      color: rgba(255, 255, 255, .85);
      text-align: center;
      font-size: .85rem;
    }

    .lightbox-close {
      position: absolute;
      top: 18px;
      right: 24px;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: #fff;
      background: rgba(255, 255, 255, .08);
      cursor: pointer;
      font-size: 1.5rem;
    }

    @media (max-width: 650px) {
      .photo-page {
        padding: 12px 14px 16px;
      }

      .photo-nav {
        gap: clamp(10px, 3vw, 20px);
        font-size: .62rem;
        letter-spacing: .08em;
      }

      .intro {
        margin-bottom: 14px;
      }

      .album-choice {
        gap: 8px;
      }

      .album-stack {
        height: clamp(155px, 27vh, 230px);
      }

      .polaroid {
        width: 75%;
      }

      .photo-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .photo-card:nth-child(n) {
        grid-column: auto;
      }

      .photo-card {
        padding: 5px 5px 7px;
      }

      .photo-card figcaption {
        padding-top: 5px;
        font-size: .66rem;
      }

      .photo-card:nth-child(5) {
        grid-column: 1 / -1;
        width: 50%;
        justify-self: center;
      }

      .gallery-heading {
        margin-bottom: 8px;
      }

      .lightbox {
        padding: 20px;
      }

      .lightbox-caption {
        right: 20px;
        bottom: 12px;
        left: 20px;
      }
    }

    @media (max-height: 620px) and (min-width: 651px) {
      .photo-page {
        padding-top: 8px;
        padding-bottom: 10px;
      }

      .photo-header {
        min-height: 42px;
      }

      .intro {
        margin-bottom: 10px;
      }

      .album-stack {
        height: 25vh;
        min-height: 140px;
      }

      .gallery-heading {
        margin-bottom: 7px;
      }

      .photo-grid {
        gap: 7px;
      }

      .photo-card {
        padding: 5px 5px 7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="photo-page" id="photoPage">
    <header class="photo-header">
      <nav class="photo-nav" aria-label="Navigation principale">
        <a href="index.html">Accueil</a>
        <a href="photos.html" aria-current="page">Photos</a>
        <a href="materiel.html">Matériel</a>
        <a href="widget.html">Widget</a>
      </nav>
    </header>

    <main class="photo-main">
      <section class="intro" id="intro">
        <p class="eyebrow">Au fil des nuits <button class="frog-inline" id="frogInline" type="button" aria-label="Lancer l’easter egg du crapaud" title="Un petit secret…">🐸</button></p>
        <h1>Mes photographies</h1>
        <p class="intro-copy">Deux albums, quelques instants capturés.</p>
      </section>

      <section class="album-choice" id="albumChoice" aria-label="Choisir un album">
        <button class="album-card" type="button" data-album="lune" aria-label="Ouvrir l’album de la Lune">
          <span class="album-stack" aria-hidden="true">
            <span class="polaroid"><img src="photos/lune/03 Juin 2023.jpg" alt=""></span>
            <span class="polaroid"><img src="photos/lune/04 Juin 2023.jpg" alt=""></span>
            <span class="polaroid"><img src="photos/lune/1 Septembre 2023.jpg" alt=""></span>
            <span class="album-emoji">🌙</span>
          </span>
          <span class="album-name">La Lune</span>
          <span class="album-hint">Ouvrir l’album</span>
        </button>

        <button class="album-card" type="button" data-album="nature" aria-label="Ouvrir l’album de la nature">
          <span class="album-stack" aria-hidden="true">
            <span class="polaroid"><img src="photos/nature/02 Mai 2024.jpg" alt=""></span>
            <span class="polaroid"><img src="photos/nature/01 09 2024(.jpg" alt=""></span>
            <span class="polaroid"><img src="photos/nature/2 Mai 2026.jpg" alt=""></span>
            <span class="album-emoji">🍃</span>
          </span>
          <span class="album-name">La nature</span>
          <span class="album-hint">Ouvrir l’album</span>
        </button>
      </section>

      <section class="album-gallery" id="albumGallery" aria-live="polite">
        <div class="gallery-heading">
          <h2 id="galleryTitle"></h2>
          <button class="back-button" id="backButton" type="button">← Les albums</button>
        </div>
        <div class="photo-grid" id="photoGrid"></div>
      </section>
    </main>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo agrandie">
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Fermer">×</button>
    <img id="lightboxImage" src="" alt="">
    <p class="lightbox-caption" id="lightboxCaption"></p>
  </div>

  <script>
    const albums = {
      lune: {
        title: "L’album de la Lune",
        photos: [
          { src: "photos/lune/03 Juin 2023.jpg", alt: "La Lune photographiée le 3 juin 2023", date: "3 juin 2023" },
          { src: "photos/lune/04 Juin 2023.jpg", alt: "La Lune photographiée le 4 juin 2023", date: "4 juin 2023" },
          { src: "photos/lune/1 Septembre 2023.jpg", alt: "La Lune photographiée le 1er septembre 2023", date: "1er septembre 2023" },
          { src: "photos/lune/2 Septembre 2023.jpg", alt: "La Lune photographiée le 2 septembre 2023", date: "2 septembre 2023" },
          { src: "photos/lune/12 Juillet 2026.jpg", alt: "La Lune photographiée le 12 juillet 2026", date: "12 juillet 2026" }
        ]
      },
      nature: {
        title: "L’album de la nature",
        photos: [
          { src: "photos/nature/02 Mai 2024.jpg", alt: "Paysage de campagne sous un ciel nuageux", date: "2 mai 2024" },
          { src: "photos/nature/01 09 2024(.jpg", alt: "Coucher de soleil sur un paysage", date: "1er septembre 2024 · photo 1" },
          { src: "photos/nature/01 09 2024.jpg", alt: "Paysage au coucher du soleil", date: "1er septembre 2024 · photo 2" },
          { src: "photos/nature/01 10 2025 (.jpg", alt: "Photographie de nature", date: "1er octobre 2025" },
          { src: "photos/nature/2 Mai 2026.jpg", alt: "Bâtiment ancien sous un ciel nuageux", date: "2 mai 2026" }
        ]
      }
    };

    const intro = document.getElementById("intro");
    const albumChoice = document.getElementById("albumChoice");
    const albumGallery = document.getElementById("albumGallery");
    const galleryTitle = document.getElementById("galleryTitle");
    const photoGrid = document.getElementById("photoGrid");
    const backButton = document.getElementById("backButton");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxCaption = document.getElementById("lightboxCaption");
    const lightboxClose = document.getElementById("lightboxClose");

    function openAlbum(name) {
      const album = albums[name];
      if (!album) return;

      galleryTitle.textContent = album.title;
      photoGrid.replaceChildren();

      album.photos.forEach((photo) => {
        const button = document.createElement("button");
        button.className = "photo-card";
        button.type = "button";
        button.setAttribute("aria-label", `Agrandir la photo du ${photo.date}`);

        const figure = document.createElement("figure");
        const image = document.createElement("img");
        image.src = photo.src;
        image.alt = photo.alt;
        image.loading = "eager";

        const caption = document.createElement("figcaption");
        caption.textContent = photo.date;

        figure.append(image, caption);
        button.append(figure);
        button.addEventListener("click", () => openLightbox(photo));
        photoGrid.append(button);
      });

      intro.hidden = true;
      albumChoice.hidden = true;
      albumGallery.classList.add("is-visible");
    }

    function closeAlbum() {
      albumGallery.classList.remove("is-visible");
      albumChoice.hidden = false;
      intro.hidden = false;
    }

    function openLightbox(photo) {
      lightboxImage.src = photo.src;
      lightboxImage.alt = photo.alt;
      lightboxCaption.textContent = photo.date;
      lightbox.classList.add("is-open");
      lightboxClose.focus();
    }

    function closeLightbox() {
      lightbox.classList.remove("is-open");
      lightboxImage.src = "";
    }

    document.querySelectorAll("[data-album]").forEach((button) => {
      button.addEventListener("click", () => openAlbum(button.dataset.album));
    });

    backButton.addEventListener("click", closeAlbum);
    lightboxClose.addEventListener("click", closeLightbox);

    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) closeLightbox();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (lightbox.classList.contains("is-open")) closeLightbox();
        else if (albumGallery.classList.contains("is-visible")) closeAlbum();
      }
    });
  </script>
<style>.frog-egg-trigger { display: none !important; } .frog-inline { border: 0; padding: 0 .25rem; color: inherit; background: transparent; font: inherit; letter-spacing: normal; text-transform: none; cursor: pointer; transition: transform .2s ease; } .frog-inline:hover { transform: scale(1.18); } .frog-inline:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; border-radius: 50%; }</style>  <script src="easter-egg.js?v=59f29e3"></script>  <script>    document.getElementById("frogInline").addEventListener("click", () => {      document.querySelector(".frog-egg-trigger")?.click();    });  </script></body>
</html>
